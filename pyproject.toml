[build-system]
requires = ["hatchling", "hatch-vcs", "requests"]
build-backend = "hatchling.build"


[project]
name = "panda-server"
dynamic = ["version"]
description = "Unified PanDA Server and JEDI Package"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    { name = "PanDA Team", email = "panda-support@cern.ch" },
]
dependencies = [
    'panda-common>=0.1.9',
    'panda-client-light>=1.5.55',
    'pyOpenSSL',
    'python-daemon',
    'mod_wsgi',
    'stomp.py',
    'pyyaml',
    'pyjwt',
    'polars',
    'requests',
    'psutil>=5.4.8',
    'idds-common',
    'idds-client',
    'idds-workflow>=1.1.0',
    'idds-doma',
    'idds-atlas',
    'ruamel.yaml',
    'cwl-utils>=0.13',
    'packaging',
    'snakemake>=9.14.5',
    'numpy',
    'scipy',
    'werkzeug',
    'requests',
    'bs4'
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
oracle = ['oracledb']
mysql = ['mysqlclient']
postgres =  ['psycopg2-binary']
rucio = ['rucio-clients']
elasticsearch = ['elasticsearch']
atlasprod =  ['oracledb', 'rucio-clients', 'elasticsearch', 'numpy', 'scipy']
mcp = ['uvicorn', 'fastmcp']

[project.urls]
Homepage = "https://panda-wms.readthedocs.io/en/latest/"

[tool.hatch.version]
path = "PandaPkgInfo.py"
pattern = "release_version = \"(?P<version>[^\"]+)\""

[tool.hatch.build]
directory = "dist"

[tool.hatch.build.targets.wheel]
exclude = ["*.template", "PandaPkgInfo.py", "hatch_build.py"]
packages = ["pandaserver", "pandajedi"]

[tool.hatch.build.targets.wheel.shared-data]
"templates" = "etc/panda"
"templates/bin" = "usr/bin"
"templates/init.d" = "etc/rc.d/init.d"
"templates/systemd" = "etc/systemd/system"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "package/hatch_build.py"

[tool.hatch.build.targets.sdist]
exclude = [
    ".github",
    ".idea",
]


[tool.black]
line-length=160

[tool.autopep8]
# https://pypi.org/project/autopep8/#pyproject-toml
max_line_length = 160
ignore = ["E501", "W6"]
in-place = true
recursive = true
aggressive = 3

[tool.pylint.master]
max-line-length = 160
[tool.pylint.'MESSAGES CONTROL']
disable = [
    "C0209",
    "R0902",
    "R0913",
    "R0914", #  R0914: Too many local variables
]

[tool.isort]
profile = "black"

[tool.flynt]
line-length = 160

[tool.flake8]
ignore = ['E501', 'U100']

# Type checking is gated on a baseline (mypy-baseline.txt) rather than on an
# error count, because annotating a function turns on checking of its whole body:
# improving the annotations can legitimately raise the number of findings. The
# flags below have to stay in sync with the baseline -- changing them, or the
# pinned mypy version in .github/workflows/syntax-check.yml, changes the set of
# errors mypy reports and invalidates the file. Regenerate it in the same commit:
#   mypy | mypy-baseline sync
[tool.mypy]
files = ["pandaserver", "pandajedi"]
ignore_missing_imports = true
# Without this, mypy skips the body of every function that has no annotations --
# which is most of this tree, so the gate would only cover the code that needs it
# least. New code goes through the gate whether or not its author annotates it.
check_untyped_defs = true

[tool.mypy-baseline]
baseline_path = "mypy-baseline.txt"
sort_baseline = true
# Notes are the continuation lines of an error that is recorded anyway, so nothing
# is lost by dropping them -- and keeping them makes the baseline depend on mypy's
# cache. mypy prints an overload variant as `def list(self) -> list[_T]` with a warm
# cache and `def __init__(self) -> list[_T]` with a cold one, so a baseline written
# on a developer's machine would not match the cold run CI does.
ignore_categories = ["note"]
# only findings a change ADDS fail the gate. Without this, a PR that fixes an
# existing finding also fails, until its author regenerates the baseline -- which
# would punish exactly the cleanup this baseline exists to make room for. The
# cost is that a resolved entry lingers until someone runs `mypy-baseline sync`.
allow_unsynced = true
