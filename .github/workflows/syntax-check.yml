name: Syntax Check

on: 
  pull_request:
  workflow_dispatch:

# a new push to the PR supersedes the previous check
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-syntax:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Check syntax of changed files
      run: |
        files=$(git diff --name-only origin/master...HEAD -- '*.py')
        if [ -n "$files" ]; then
          echo "$files" | xargs -n1 python -m py_compile
        else
          echo "No Python files changed."
        fi

    # py_compile only parses, so a name that does not exist compiles fine and
    # raises at import time instead -- in a daemon, that is an outage rather
    # than a test failure. Type annotations make this easy to hit, because the
    # class named in one has to be imported even though nothing calls it.
    - name: Install ruff
      run: pip install 'ruff==0.14.5'

    # the whole tree, not just the changed files: the tree is clean, the scan
    # takes well under a second for ~380 files, and a name can be broken by an
    # edit somewhere else -- a renamed import, a deleted helper, a moved class.
    - name: Check for undefined names
      run: ruff check --isolated --select F821 .

    # Enforced against a baseline, not against zero. The tree still carries ~2190
    # findings, most of them annotations too weak to say anything -- `dict` where
    # the value type matters, `object` where a real class does -- so mypy-baseline
    # filters out everything already recorded in mypy-baseline.txt and fails only
    # on findings a PR adds. A count-based gate would not work here: annotating a
    # function turns on checking of its whole body, so improving the annotations
    # can raise the number of findings.
    #
    # The whole tree, not just the changed files: a cold run takes about five
    # seconds, and the baseline only lines up if every run sees the same files
    # with the same flags. The flags live in [tool.mypy] in pyproject.toml.
    #
    # Fixing a recorded finding never fails this step (allow_unsynced), so the
    # baseline can go stale as findings are cleaned up. To drop resolved entries,
    # to record a finding you are not fixing, or to refresh after a mypy upgrade:
    #   mypy | mypy-baseline sync
    # and commit mypy-baseline.txt in the same PR.
    - name: Type check against baseline
      run: |
        pip install 'mypy==1.13.0' 'mypy-baseline==0.7.4'
        mypy | mypy-baseline filter
