name: Syntax Check

on: 
  pull_request:
  workflow_dispatch:

# a new push to the PR supersedes the previous check
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-syntax:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Check syntax of changed files
      run: |
        files=$(git diff --name-only origin/master...HEAD -- '*.py')
        if [ -n "$files" ]; then
          echo "$files" | xargs -n1 python -m py_compile
        else
          echo "No Python files changed."
        fi

    # py_compile only parses, so a name that does not exist compiles fine and
    # raises at import time instead -- in a daemon, that is an outage rather
    # than a test failure. Type annotations make this easy to hit, because the
    # class named in one has to be imported even though nothing calls it.
    - name: Install ruff
      run: pip install 'ruff==0.14.5'

    # the whole tree, not just the changed files: the tree is clean, the scan
    # takes well under a second for ~380 files, and a name can be broken by an
    # edit somewhere else -- a renamed import, a deleted helper, a moved class.
    - name: Check for undefined names
      run: ruff check --isolated --select F821 .

    # Reported, not enforced. The tree currently has ~1700 mypy findings, most of
    # them annotations too weak to say anything -- `dict` where the value type
    # matters, `object` where a real class does. Failing on that would mean
    # failing every PR, so this prints the count for the files a PR touches and
    # leaves the judgement to the reviewer.
    - name: Type-check changed files (advisory)
      continue-on-error: true
      run: |
        pip install 'mypy==1.13.0'
        files=$(git diff --name-only --diff-filter=d origin/master...HEAD -- '*.py')
        if [ -n "$files" ]; then
          echo "$files" | xargs mypy --ignore-missing-imports --follow-imports=silent
        else
          echo "No Python files changed."
        fi
